<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vista de personas</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Registro de personas que necesitan ayuda</h1>
      <p class="small">Aquí se registran solicitudes de doctor, traslado o medicina.</p>
      <a class="link" href="index.html">← volver al inicio</a>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Subir solicitud</h2>
        <form id="person-form">
          <label>Tipo de ayuda</label>
          <select id="type">
            <option value="Doctor">Doctor</option>
            <option value="Traslado">Traslado</option>
            <option value="Medicina">Medicina</option>
          </select>

          <div id="doctor-fields" class="dynamic-fields">
            <label>Nombre de la persona</label>
            <input id="name" placeholder="Ej. Ana Pérez" />

            <label>Colonia</label>
            <input id="colonia" placeholder="Ej. Loma Linda" />

            <label>Referencia</label>
            <input id="reference" placeholder="Ej. Casa azul al final de la calle" />

            <label>Foto de la persona</label>
            <input type="file" id="photo" accept="image/*" />

            <label>Detalles</label>
            <textarea id="detail" rows="4" placeholder="Ej. No se puede movilizar y necesita atención médica"></textarea>

            <label>Ubicación o calle</label>
            <input id="street" placeholder="Ej. Calle 5 entre 10 y 12" />

            <label>Descripción de la calle más accesible</label>
            <textarea id="street-description" rows="2" placeholder="Ej. Hay una entrada amplia y se puede llegar por el lado izquierdo"></textarea>
          </div>

          <div id="traslado-fields" class="dynamic-fields" style="display: none;">
            <label>Nombre de la persona</label>
            <input id="traslado-name" placeholder="Ej. Luis Ramírez" />

            <label>Dirección</label>
            <input id="address" placeholder="Ej. Av. Central #12" />

            <label>Foto de la persona</label>
            <input type="file" id="traslado-photo" accept="image/*" />

            <label>Detalles</label>
            <textarea id="traslado-detail" rows="4" placeholder="Ej. Necesita transporte para acudir a una cita"></textarea>
          </div>

          <div id="medicina-fields" class="dynamic-fields" style="display: none;">
            <label>Nombre de la persona</label>
            <input id="medicina-name" placeholder="Ej. María Torres" />

            <label>Colonia</label>
            <input id="medicina-colonia" placeholder="Ej. San Miguel" />

            <label>Calle</label>
            <input id="medicina-street" placeholder="Ej. Calle 8" />

            <label>Descripción de la medicina</label>
            <textarea id="medicina-description" rows="4" placeholder="Ej. Paquete de pastillas para presión"></textarea>

            <label>Foto de INE de quien entregará la medicina</label>
            <input type="file" id="medicina-photo" accept="image/*" />
          </div>

          <button type="submit">Guardar solicitud</button>
        </form>
      </div>
    </div>

    <div class="card">
      <h2>Solicitudes registradas</h2>
      <div id="request-list" class="list"></div>
    </div>
  </div>

  <script src="js/personas.js"></script>
</body>
</html>
