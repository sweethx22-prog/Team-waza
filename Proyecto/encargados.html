<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vista de encargados</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Vista para encargados</h1>
      <p class="small">Para ver esta sección, ingresa un usuario y contraseña correctos.</p>
      <a class="link" href="index.html">← volver al inicio</a>
    </div>

    <div id="login-card" class="card">
      <h2>Acceso de encargado</h2>
      <label for="user">Usuario</label>
      <input id="user" placeholder="Ej. admin" />

      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="Ej. 1234" />

      <button id="login-btn" type="button">Entrar</button>
      <p id="login-error" class="small" style="color: #c94b4b; display: none;">Usuario o contraseña incorrectos.</p>
    </div>

    <div id="content-area" style="display: none;">
      <div class="grid">
        <div class="card">
          <h2>Solicitudes pendientes</h2>
          <div id="pending-list" class="list"></div>
        </div>

        <div class="card">
          <h2>Gestión de medicina</h2>
          <div id="medicine-list" class="list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/encargados.js"></script>
</body>
</html>
